<!DOCTYPE html>
    <html lang = "uk">
    <head>
        <meta charset = "UTF-8">
            <meta name = "viewport" content="width=device-width, initial-scale=1.0">
                <title>Погодний дашборд</title>
                    <link rel = "stylesheet" href="css/style.css">
    </head> 

    <body>
    <header>
        <h1>Погодний дашборд</h1>
        <nav>
        <a href="#current">Поточна погода</a>
        <a href="#forecast">Прогноз</a>
        </nav>
    </header>
    <main>
        <section id = "current">
            <h2>Поточна погода</h2>
            <img src="assets/img/sunny.jpg" alt="Сонячно, без опадів" width="100">
            <p>+21°C, ясно</p>
        </section>
        <section id = "forecast">
           <h2>Прогноз на тиждень</h2>
            <article class = "weekend_day">
                    <h3>Вівторок</h3>
                    <p class = "temperature_huminity">+18°C; хмарно</p>
                </article>
                <article class = "weekend_day">
                    <h3>Середа</h3>
                    <p class = "temperature_huminity">+16°C; дощ</p>
                </article>
                <article class = "weekend_day">
                    <h3>Четвер</h3>
                    <p class = "temperature_huminity">+20°C; ясно</p>
                </article>
                <article class = "weekend_day">
                    <h3>П'ятниця</h3>
                    <p class = "temperature_huminity">+20°C; ясно</p>
                </article>
            </section>
    </main>
    
    <footer>
        <p>Дані надані навчальним прикладом. &copy; 2026</p>
    </footer>
        <script src = "js/app.js"></script>
    </body>
</html>
